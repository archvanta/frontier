# Hourly (best-effort) news collection. Commits public/data only when it changed, then redeploys.
# Commits made with GITHUB_TOKEN do not trigger other workflows, so there is no update loop;
# the deploy is called explicitly below instead.
# GitHub may skip a scheduled run when it is busy, so there are two slots per hour; a slot with no
# news makes no commit and no deploy, so the second one costs about a minute of runner time.
name: Update news

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      translate:
        description: Run offline Persian translation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements*.txt
      - name: Install collector
        run: pip install -r pipeline/requirements.txt -r pipeline/requirements-translate.txt
      - name: Restore translation model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/signal-ai/models
          key: argos-translate-en_fa-1.5-v1
      - name: Collect
        working-directory: pipeline
        env:
          # Repository variable SIGNAL_TRANSLATE=0 turns translation off for scheduled runs.
          SIGNAL_TRANSLATE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.translate) && '0' || vars.SIGNAL_TRANSLATE || '1' }}
        run: python -m signal_pipeline collect --out ../public/data
      - name: Commit data if it changed
        id: commit
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "No data change; nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: news update $(date -u +%Y-%m-%dT%H:%MZ)"
          branch="${{ github.event.repository.default_branch }}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$branch"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              echo "Committed $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Someone else pushed meanwhile: replay only our data commit on top (never force-push).
            git pull --rebase origin "$branch" || { git rebase --abort; echo "::error::Data commit conflicts with $branch"; exit 1; }
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the data commit after 3 attempts"
          exit 1

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.collect.outputs.sha }}
