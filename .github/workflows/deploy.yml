# Builds the static site and publishes it with the official GitHub Pages actions.
# Runs on pushes to main, by hand, and after a news update (called from update-news.yml).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (the data commit made by the news update)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Exact project path from Pages (e.g. /SIGNAL_AI/), so assets resolve on the published URL.
          SIGNAL_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional accounts (docs/AUTH-SETUP.md). Repository *variables*, not secrets: both values are
          # public by design and protected by Row Level Security. Empty = accounts switched off.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_GOOGLE: ${{ vars.SUPABASE_GOOGLE_ENABLED }}
      - name: Check the artifact
        run: |
          test -f dist/index.html
          test -f dist/videos/signal-ai-intro.mp4
          grep -q "${{ steps.pages.outputs.base_path }}/assets/" dist/index.html
          if [ -d public/data ]; then test -f dist/data/meta.json; fi
          # A Supabase secret / service_role key must never be published.
          node scripts/check-bundle-keys.mjs dist
          du -sh dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report URL
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
