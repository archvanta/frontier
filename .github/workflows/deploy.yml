# Builds the static site and publishes it with the official GitHub Pages actions.
# Runs after CI passes on a push to main (a red CI never publishes), by hand, and after a news update (called from update-news.yml).
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build (the data commit made by the news update)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    # After CI: only a successful run for a push to main.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # After CI, start from the tip of main (it may hold newer news data than the commit CI checked).
          ref: ${{ github.event_name == 'workflow_run' && 'main' || inputs.ref || github.sha }}
          fetch-depth: ${{ github.event_name == 'workflow_run' && 0 || 1 }}
          persist-credentials: false
      - name: Build only what CI checked
        if: github.event_name == 'workflow_run'
        env:
          CHECKED: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tip of main is used only when everything after the checked commit is news data (public/data);
          # any other change waits for its own CI run.
          if git diff --quiet "$CHECKED" HEAD -- . ':(exclude)public/data'; then
            echo "Building main at $(git rev-parse --short HEAD): only news data changed since $CHECKED."
          else
            git checkout --detach "$CHECKED"
            echo "Building the commit CI checked: $CHECKED."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Exact project path from Pages (e.g. /frontier/), so assets resolve on the published URL.
          SIGNAL_BASE: ${{ steps.pages.outputs.base_path }}/
          # Public browser settings protected by Row Level Security. Repository variables can
          # override this project's defaults; never put a secret/service_role key here.
          VITE_ACCOUNTS_ENABLED: 'false'
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Check the artifact
        run: |
          test -f dist/index.html
          test -f dist/videos/signal-ai-intro.mp4
          grep -q "${{ steps.pages.outputs.base_path }}/assets/" dist/index.html
          if [ -d public/data ]; then test -f dist/data/meta.json; fi
          # A Supabase secret / service_role key must never be published.
          node scripts/check-bundle-keys.mjs dist
          du -sh dist
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Report URL
        run: echo "Published to ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
