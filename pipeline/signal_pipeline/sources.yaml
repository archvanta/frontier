# SIGNAL AI source registry.
# A source is only reported as verified after a real pipeline run fetched and parsed it
# (see public/data/sources.json → verifiedOn). Do not mark verification by hand.
#
# Fields
#   id, name, homepage, feed       identity and feed URL (RSS or Atom)
#   kind      official | research | media | community
#   tier      1 primary/official · 2 major reputable media · 3 specialist outlet · 4 community/mirror
#   owner     corporate group, so sister outlets don't count as independent corroboration
#   lang      source language
#   category  default category when keyword rules don't decide
#   filter    ai = keep only items that look AI-related (general feeds); none = keep all
#   brand     official channel of a brand → its stories map to that brand's artwork (see brands.py)
#   og_image  allow fetching og:image from article pages on og_hosts when the feed has no image
#   max_items cap per run
#   notes     terms / caveats
#   expect_title  optional: the feed's own title must equal this (YouTube channel name), else the source errors

sources:
  # ---------- Official labs & companies ----------
